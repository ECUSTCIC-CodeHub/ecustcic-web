master:
  push:
    - name: sync
      runner:
        cpus: 1
      imports: https://cnb.cool/ecustcic/key/-/blob/main/env.yml
      stages:
        - name: sync to gitee
          image: tencentcom/git-sync
          settings:
            target_url: https://gitee.com/ecustcic/ecustcic-web.git
            auth_type: https
            username: ${GITEE_USERNAME}
            password: ${GITEE_ACCESS_TOKEN}
            force: true
        - name: sync to github
          image: tencentcom/git-sync
          settings:
            target_url: https://github.com/ECUSTCIC-CodeHub/ecustcic-web.git
            auth_type: https
            username: ${GITHUB_USERNAME}
            password: ${GITHUB_ACCESS_TOKEN}
            force: true
    - name: edgeone
      runner:
        cpus: 2
      imports: https://cnb.cool/ecustcic/key/-/blob/main/env.yml
      stages:
        # 在 Node 22 容器内安装 EdgeOne CLI，由 CLI 自动执行 npm install + npm run build:edge
        - name: Build and Deploy to EdgeOne Pages
          image: docker.cnb.cool/arsrna/dev-env/node22
          script: |
            node -v
            npm config set registry https://mirrors.tencent.com/npm/
            npm install -g edgeone@1.7.6
            edgeone pages deploy -n ecustcic -t "$EDGEONE_API_TOKEN"
